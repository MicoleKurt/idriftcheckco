name: Bug report
description: Something behaved incorrectly or the output was misleading
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The exact commands. `npx idriftcheckco demo` reproduces nothing private, so try it first if you can.
      render: bash
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: idriftcheckco version
      description: Output of `npx idriftcheckco --version`
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Node version and OS
      placeholder: Node 22.11, Windows 11
    validations:
      required: true
  - type: textarea
    id: agentver
    attributes:
      label: Agent CLI version (for import or replay problems)
      description: Transcript formats change between versions, so this matters.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I removed secrets and private content from anything I pasted (session files contain your prompts and code).
          required: true
