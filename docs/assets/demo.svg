<svg xmlns="http://www.w3.org/2000/svg" width="731" height="736" viewBox="0 0 731 736" role="img" aria-label="Terminal running npx idriftcheckco demo and reporting a regression">
<title>npx idriftcheckco demo</title>
<style>
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;font-size:13px;white-space:pre}
.a{opacity:0;animation:show .01s linear forwards}
@keyframes show{to{opacity:1}}
@media (prefers-reduced-motion:reduce){.a{animation:none;opacity:1}}
</style>
<rect width="731" height="736" rx="10" fill="#0d1117"/>
<rect width="731" height="34" rx="10" fill="#161b22"/>
<rect y="24" width="731" height="10" fill="#161b22"/>
<circle cx="20" cy="17" r="6" fill="#ff5f56"/><circle cx="40" cy="17" r="6" fill="#ffbd2e"/><circle cx="60" cy="17" r="6" fill="#27c93f"/>
<text x="365.5" y="21" fill="#8b949e" text-anchor="middle" style="font-size:12px">idriftcheckco</text>
<text x="22" y="61" fill="#e6edf3" xml:space="preserve"><tspan class="a" style="animation-delay:0.40s">$</tspan><tspan class="a" style="animation-delay:0.45s"> </tspan><tspan class="a" style="animation-delay:0.49s">n</tspan><tspan class="a" style="animation-delay:0.54s">p</tspan><tspan class="a" style="animation-delay:0.58s">x</tspan><tspan class="a" style="animation-delay:0.63s"> </tspan><tspan class="a" style="animation-delay:0.67s">i</tspan><tspan class="a" style="animation-delay:0.72s">d</tspan><tspan class="a" style="animation-delay:0.76s">r</tspan><tspan class="a" style="animation-delay:0.80s">i</tspan><tspan class="a" style="animation-delay:0.85s">f</tspan><tspan class="a" style="animation-delay:0.90s">t</tspan><tspan class="a" style="animation-delay:0.94s">c</tspan><tspan class="a" style="animation-delay:0.98s">h</tspan><tspan class="a" style="animation-delay:1.03s">e</tspan><tspan class="a" style="animation-delay:1.07s">c</tspan><tspan class="a" style="animation-delay:1.12s">k</tspan><tspan class="a" style="animation-delay:1.17s">c</tspan><tspan class="a" style="animation-delay:1.21s">o</tspan><tspan class="a" style="animation-delay:1.25s"> </tspan><tspan class="a" style="animation-delay:1.30s">d</tspan><tspan class="a" style="animation-delay:1.34s">e</tspan><tspan class="a" style="animation-delay:1.39s">m</tspan><tspan class="a" style="animation-delay:1.44s">o</tspan></text>
<text class="a" x="22" y="88" style="animation-delay:1.98s"></text>
<text class="a" x="22" y="106" style="animation-delay:2.05s"><tspan fill="#e6edf3"> </tspan><tspan fill="#e6edf3" font-weight="700">idriftcheckco</tspan><tspan fill="#e6edf3">  control [claude-opus-4-8] (4 runs) </tspan><tspan fill="#8b949e">▸</tspan><tspan fill="#e6edf3"> opus-5-5 [claude-opus-5-5] (4 runs)</tspan></text>
<text class="a" x="22" y="124" style="animation-delay:2.12s"></text>
<rect class="a" style="animation-delay:2.19s" x="28.8" y="130" width="95.6" height="17" rx="4" fill="#ff7b72"/><text class="a" x="22" y="142" style="animation-delay:2.19s"><tspan fill="#e6edf3"> </tspan><tspan fill="#0d1117" font-weight="700"> REGRESSION </tspan><tspan fill="#e6edf3">  The candidate behaves measurably worse. Do not ship without a look.</tspan></text>
<text class="a" x="22" y="160" style="animation-delay:2.26s"></text>
<text class="a" x="22" y="178" style="animation-delay:2.33s"><tspan fill="#e6edf3"> </tspan><tspan fill="#e6edf3" font-weight="700">HARD</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#8b949e">what the agent produced</tspan></text>
<text class="a" x="22" y="196" style="animation-delay:2.40s"><tspan fill="#e6edf3">  </tspan><tspan fill="#ff7b72">✖</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#e6edf3" font-weight="700">`node test.mjs` fails more often</tspan></text>
<text class="a" x="22" y="214" style="animation-delay:2.47s"><tspan fill="#8b949e">      Passes in 0/4 candidate runs versus 4/4 baseline runs (p=0.029).</tspan></text>
<text class="a" x="22" y="232" style="animation-delay:2.54s"><tspan fill="#e6edf3">  </tspan><tspan fill="#e3b341">✖</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#e6edf3" font-weight="700">No longer changes src/slugify.js</tspan><tspan fill="#8b949e"> unconfirmed</tspan></text>
<text class="a" x="22" y="250" style="animation-delay:2.61s"><tspan fill="#8b949e">      The baseline changed this file in 4/4 runs; the candidate in 2/4 (p=0.429).</tspan></text>
<text class="a" x="22" y="268" style="animation-delay:2.68s"><tspan fill="#e6edf3">  </tspan><tspan fill="#e3b341">✖</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#e6edf3" font-weight="700">Now changes README.md</tspan><tspan fill="#8b949e"> unconfirmed</tspan></text>
<text class="a" x="22" y="286" style="animation-delay:2.75s"><tspan fill="#8b949e">      The baseline changed this file in 0/4 runs; the candidate in 2/4 (p=0.429).</tspan></text>
<text class="a" x="22" y="304" style="animation-delay:2.82s"></text>
<text class="a" x="22" y="322" style="animation-delay:2.89s"><tspan fill="#e6edf3"> </tspan><tspan fill="#e6edf3" font-weight="700">SOFT</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#8b949e">how it got there</tspan></text>
<text class="a" x="22" y="340" style="animation-delay:2.96s"><tspan fill="#e6edf3">  </tspan><tspan fill="#e3b341">▲</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#e6edf3" font-weight="700">Cost +127%</tspan></text>
<text class="a" x="22" y="358" style="animation-delay:3.03s"><tspan fill="#8b949e">      $0.218 → $0.493 (mean of 4 vs 4 runs) (p=0.029).</tspan></text>
<text class="a" x="22" y="376" style="animation-delay:3.10s"><tspan fill="#e6edf3">  </tspan><tspan fill="#e3b341">▲</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#e6edf3" font-weight="700">Duration +92%</tspan></text>
<text class="a" x="22" y="394" style="animation-delay:3.17s"><tspan fill="#8b949e">      37.2s → 1.2m (mean of 4 vs 4 runs) (p=0.029).</tspan></text>
<text class="a" x="22" y="412" style="animation-delay:3.24s"><tspan fill="#e6edf3">  </tspan><tspan fill="#56d4dd">●</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#e6edf3" font-weight="700">Tool calls -37%</tspan></text>
<text class="a" x="22" y="430" style="animation-delay:3.31s"><tspan fill="#8b949e">      4 → 2.5 (mean of 4 vs 4 runs) (p=0.029).</tspan></text>
<text class="a" x="22" y="448" style="animation-delay:3.38s"><tspan fill="#e6edf3">  </tspan><tspan fill="#e3b341">▲</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#e6edf3" font-weight="700">Tokens +118%</tspan></text>
<text class="a" x="22" y="466" style="animation-delay:3.45s"><tspan fill="#8b949e">      42.0k → 91.4k (mean of 4 vs 4 runs) (p=0.029).</tspan></text>
<text class="a" x="22" y="484" style="animation-delay:3.52s"><tspan fill="#e6edf3">  </tspan><tspan fill="#e3b341">⚠</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#e6edf3" font-weight="700">Stops running `node test.mjs`</tspan></text>
<text class="a" x="22" y="502" style="animation-delay:3.59s"><tspan fill="#8b949e">      Verification step present in 4/4 baseline runs but 0/4 candidate runs</tspan></text>
<text class="a" x="22" y="520" style="animation-delay:3.66s"><tspan fill="#8b949e">      (p=0.029). Bugs can now ship unnoticed.</tspan></text>
<text class="a" x="22" y="538" style="animation-delay:3.73s"><tspan fill="#e6edf3">  </tspan><tspan fill="#56d4dd">●</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#e6edf3" font-weight="700">Different order of work</tspan><tspan fill="#8b949e"> unconfirmed</tspan></text>
<text class="a" x="22" y="556" style="animation-delay:3.80s"><tspan fill="#8b949e">      Step-sequence similarity is 33% versus 100% between baseline runs (the noise</tspan></text>
<text class="a" x="22" y="574" style="animation-delay:3.87s"><tspan fill="#8b949e">      floor). Heuristic, not a significance test.</tspan></text>
<text class="a" x="22" y="592" style="animation-delay:3.94s"></text>
<text class="a" x="22" y="610" style="animation-delay:4.01s"><tspan fill="#e6edf3"> </tspan><tspan fill="#e6edf3" font-weight="700">METRICS</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#8b949e">mean ±sd</tspan></text>
<text class="a" x="22" y="628" style="animation-delay:4.08s"><tspan fill="#e6edf3">  Tool calls                4  </tspan><tspan fill="#8b949e">▸</tspan><tspan fill="#e6edf3">       2.5 ±0.6   -37%  </tspan><tspan fill="#8b949e">p=0.029</tspan></text>
<text class="a" x="22" y="646" style="animation-delay:4.15s"><tspan fill="#e6edf3">  Cost         $0.218 ±$0.007  </tspan><tspan fill="#8b949e">▸</tspan><tspan fill="#e6edf3"> $0.493 ±$0.026  +127%  </tspan><tspan fill="#8b949e">p=0.029</tspan></text>
<text class="a" x="22" y="664" style="animation-delay:4.22s"><tspan fill="#e6edf3">  Tokens          42.0k ±1.7k  </tspan><tspan fill="#8b949e">▸</tspan><tspan fill="#e6edf3">    91.4k ±5.8k  +118%  </tspan><tspan fill="#8b949e">p=0.029</tspan></text>
<text class="a" x="22" y="682" style="animation-delay:4.29s"><tspan fill="#e6edf3">  Duration        37.2s ±2.1s  </tspan><tspan fill="#8b949e">▸</tspan><tspan fill="#e6edf3">     1.2m ±2.2s   +92%  </tspan><tspan fill="#8b949e">p=0.029</tspan></text>
<text class="a" x="22" y="700" style="animation-delay:4.36s"><tspan fill="#e6edf3">  Tool errors               0  </tspan><tspan fill="#8b949e">▸</tspan><tspan fill="#e6edf3">              0     0%  </tspan><tspan fill="#8b949e">p=1.000</tspan></text>
</svg>
